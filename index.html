<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VIDA — Uma História Interativa</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08090d;color:#eee;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button{font:inherit}.app{max-width:1100px;margin:auto;min-height:100vh;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid #252832;padding:8px 0 16px}
.logo{font-weight:900;letter-spacing:5px;font-size:25px}.sub{color:#777;font-size:12px;letter-spacing:1px}
.hud{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#11131a;border:1px solid #292d38;border-radius:999px;padding:8px 12px;font-size:12px;color:#bbb}
main{margin-top:22px}.scene{min-height:570px;background:linear-gradient(145deg,#11131a,#0c0e13);border:1px solid #252832;border-radius:22px;overflow:hidden;box-shadow:0 25px 80px #0008}
.sceneTop{padding:28px 30px 10px;display:flex;justify-content:space-between;color:#777;font-size:12px}.sceneBody{padding:10px 30px 30px;max-width:850px}
.time{font-size:13px;color:#999;margin:10px 0 25px}.title{font-size:clamp(28px,5vw,52px);line-height:1.05;margin:0 0 22px;letter-spacing:-2px}
.text{font-size:18px;line-height:1.75;color:#d8d8dc;white-space:pre-line}.dialogue{margin:24px 0;padding:18px 20px;border-left:3px solid #aaa;background:#ffffff08;border-radius:0 12px 12px 0}
.speaker{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#888;margin-bottom:6px}.quote{font-size:17px;line-height:1.55}
.choices{display:grid;gap:10px;margin-top:30px}.choice{background:#151821;border:1px solid #303441;color:#eee;padding:17px 18px;border-radius:13px;text-align:left;cursor:pointer;transition:.18s;display:flex;gap:15px;align-items:center}
.choice:hover{transform:translateY(-2px);border-color:#777;background:#1b1f29}.num{width:30px;height:30px;border:1px solid #555;border-radius:50%;display:grid;place-items:center;color:#aaa;flex:none}
.small{font-size:12px;color:#777;margin-top:20px}.phone{background:#050608;border:1px solid #333;border-radius:25px;padding:18px;max-width:430px;margin:20px auto}.msg{background:#20232c;border-radius:14px;padding:12px;margin:8px 0;max-width:80%}.me{margin-left:auto;background:#333741}.ending{padding:35px}.ending h1{font-size:48px;margin:5px 0 15px}.tag{display:inline-block;border:1px solid #555;border-radius:999px;padding:6px 10px;color:#aaa;font-size:11px;text-transform:uppercase;letter-spacing:1px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.action{border:1px solid #383c48;background:#141720;color:#eee;border-radius:10px;padding:11px 15px;cursor:pointer}.action:hover{background:#1c202a}
.gallery{margin-top:18px;border:1px solid #252832;border-radius:16px;padding:20px;background:#0d0f14}.gallery h3{margin-top:0}.ends{display:flex;flex-wrap:wrap;gap:8px}.end{font-size:12px;padding:8px 10px;border-radius:9px;background:#171a22;color:#aaa}.unlocked{color:#eee;border:1px solid #444}
@media(max-width:650px){.app{padding:10px}.sceneTop,.sceneBody{padding-left:18px;padding-right:18px}.scene{min-height:650px}.text{font-size:16px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div><div class="logo">VIDA</div><div class="sub">UMA HISTÓRIA INTERATIVA</div></div>
  <div class="hud"><span class="pill" id="date">SEXTA • 23:47</span><span class="pill" id="status">Você está aqui.</span></div>
</header>

<main><div class="scene" id="game"></div></main>
<div class="gallery"><h3>Memórias descobertas</h3><div class="ends" id="gallery"></div></div>
</div>

<script>
const scenes = {
start:{
 time:"SEXTA-FEIRA • 23:47", title:"A mensagem", text:`O quarto está escuro. Só a luz do celular ilumina seu rosto.

Você deveria estar dormindo há pelo menos uma hora.

O celular vibra novamente.`,
 dialogue:["MÃE","Você ainda está acordado?"],
 choices:[
  ["Responder agora","reply"],
  ["Deixar para amanhã","ignore"],
  ["Perguntar o que aconteceu","ask"]
 ]},
reply:{
 time:"23:48 • QUARTO",title:"“Sim.”",text:`Você responde quase no automático.

Três pontinhos aparecem. Somem. Aparecem de novo.

Dessa vez, a mensagem demora.`,
 dialogue:["MÃE","A gente precisa conversar amanhã. Sobre seu pai."],
 choices:[["Perguntar se aconteceu alguma coisa","family"],["Dizer que está cansado e dormir","sleep"],["Ligar para ela","call"]]
},
ignore:{
 time:"23:49 • QUARTO",title:"Amanhã eu vejo isso.",text:`Você vira o celular para baixo.

Cinco minutos.

Dez.

O sono não vem.

Quando finalmente fecha os olhos, o celular vibra mais uma vez — mas você decide não olhar.`,
 choices:[["Dormir","morning"],["Pegar o celular","late"]]
},
ask:{
 time:"23:48 • QUARTO",title:"“Sobre o quê?”",text:`A resposta chega rápido demais.

“Não é por mensagem.”

Você encara a tela. De repente, aquela conversa parece muito maior do que deveria ser.`,
 choices:[["Insistir","family"],["Tudo bem. Amanhã.","sleep"],["Ligar agora","call"]]
},
family:{
 time:"23:51 • CELULAR",title:"Uma conversa que você não queria ter",text:`Sua mãe conta que seu pai saiu de casa depois de uma discussão.

Ela não sabe quando ele volta.

Você fica alguns segundos sem saber o que dizer.`,
 dialogue:["MÃE","Eu só queria que você não se preocupasse com isso."],
 choices:[["“Eu estou preocupado.”","honest"],["“Vai ficar tudo bem.”","comfort"],["Mudar de assunto","deflect"]]
},
sleep:{
 time:"00:02 • QUARTO",title:"Você escolhe dormir.",text:`Talvez amanhã seja mais fácil.

Você coloca o celular no carregador e fecha os olhos.

Só que algumas coisas não desaparecem quando a gente dorme.`,
 choices:[["Continuar","morning"]]
},
call:{
 time:"23:53 • LIGAÇÃO",title:"A voz do outro lado",text:`Sua mãe atende.

Por alguns segundos, nenhum dos dois fala.

Então você percebe que ela está chorando.`,
 dialogue:["MÃE","Desculpa você ter que ouvir isso."],
 choices:[["Ficar na ligação","honest"],["Dizer que está tudo bem","comfort"]]
},
honest:{
 time:"00:18 • SALA",title:"Pela primeira vez",text:`Você para de tentar consertar tudo.

“Eu não sei o que fazer.”

Sua mãe respira fundo.

Às vezes, admitir que não sabe é a única coisa honesta que existe.`,
 choices:[["Ficar conversando","morning"],["Ir dormir","morning"]]
},
comfort:{
 time:"00:15 • SALA",title:"“Vai ficar tudo bem.”",text:`Você diz isso porque é o que as pessoas dizem.

Sua mãe agradece.

Mas você sabe que não tem como prometer uma coisa dessas.`,
 choices:[["Continuar a conversa","morning"],["Encerrar e dormir","morning"]]
},
deflect:{
 time:"00:01 • QUARTO",title:"Você muda de assunto.",text:`Vocês conversam sobre coisas pequenas.

Escola. Trabalho. O jantar.

É confortável por alguns minutos.

Talvez confortável demais.`,
 choices:[["Dormir","morning"]]
},
late:{
 time:"00:14 • QUARTO",title:"Você olha.",text:`É uma mensagem do seu melhor amigo, Lucas.

“Mano, tá acordado?”

Antes que você responda, chega outra:

“Preciso falar com você amanhã.”`,
 choices:[["“Fala agora.”","lucas"],["“Amanhã a gente fala.”","morning"]]
},
morning:{
 time:"SÁBADO • 08:12",title:"O dia seguinte",text:`Você acorda antes do despertador.

Por alguns segundos, esquece tudo.

Então lembra.

O celular tem quatro notificações.

Uma da sua mãe.

Uma do Lucas.

Uma de alguém que você não esperava.`,
 choices:[["Ver as mensagens","phone"],["Levantar e sair do quarto","outside"],["Voltar a dormir","alone"]]
},
lucas:{
 time:"00:19 • CHAT",title:"Lucas",text:`Lucas demora para escrever.

“Eu fiz uma merda.”

Você conhece aquele jeito de escrever. Não é uma brincadeira.`,
 choices:[["“Que merda?”","secret"],["“Amanhã você me conta.”","morning"]]
},
phone:{
 time:"08:14 • CELULAR",title:"Quatro notificações",text:`Sua mãe: “Bom dia. Quando acordar, fala comigo.”

Lucas: “Você pode me encontrar hoje?”

E a terceira mensagem é de Marina.

“Sonhei com você ontem kkkkk.”`,
 choices:[["Responder sua mãe","outside"],["Responder Lucas","secret"],["Responder Marina","love"]]
},
outside:{
 time:"09:03 • COZINHA",title:"A casa está diferente",text:`Seu pai não está na mesa.

Sua mãe está fazendo café como se fosse um sábado normal.

Ela olha para você.

Você percebe que ela quer perguntar alguma coisa.`,
 choices:[["Sentar com ela","familyday"],["Pegar café e sair","street"],["Perguntar pelo seu pai","truth"]]
},
alone:{
 time:"11:41 • QUARTO",title:"Mais cinco minutos",text:`Você dorme de novo.

Quando acorda, já passou do meio-dia.

Lucas mandou mais uma mensagem.

“Esquece. Resolvi.”`,
 choices:[["Perguntar o que aconteceu","secret"],["Deixar quieto","street"]]
},
familyday:{
 time:"09:15 • COZINHA",title:"Café frio",text:`Vocês ficam em silêncio por um tempo.

Sua mãe finalmente fala.

“Você está bem?”

A pergunta parece simples. A resposta não.`,
 choices:[["“Não muito.”","truth"],["“Tô.”","street"]]
},
truth:{
 time:"09:18 • COZINHA",title:"Você pergunta",text:`Sua mãe olha para a xícara.

“Ele precisa de um tempo.”

Você sente vontade de perguntar mil coisas.

Mas escolhe uma.`,
 choices:[["“Ele vai voltar?”","future"],["“Foi por minha causa?”","guilt"],["Não perguntar mais nada","street"]]
},
guilt:{
 time:"09:20 • COZINHA",title:"A culpa",text:`Sua mãe imediatamente diz que não.

Mas você percebe que já tinha pensado nisso antes mesmo de perguntar.

Ela segura sua mão.`,
 dialogue:["MÃE","Você não precisa carregar tudo sozinho."],
 choices:[["Acreditar nela","future"],["Não responder","street"]]
},
street:{
 time:"10:02 • RUA",title:"Lá fora",text:`Você sai sem um plano.

A cidade está seguindo normalmente.

É estranho como o mundo continua funcionando quando a sua cabeça parece ter parado.`,
 choices:[["Ir encontrar Lucas","secret"],["Encontrar Marina","love"],["Andar sozinho","future"]]
},
secret:{
 time:"11:20 • PRAÇA",title:"A merda",text:`Lucas finalmente conta.

Ele pegou dinheiro escondido em casa para pagar uma dívida.

Não foi muito.

Mas foi o suficiente para transformar uma coisa pequena em um problema enorme.`,
 choices:[["Ajudar a esconder","bad"],["Mandar ele contar a verdade","good"],["Oferecer seu próprio dinheiro","sacrifice"]]
},
love:{
 time:"11:37 • CAFÉ",title:"Marina",text:`Marina sorri quando te vê.

Vocês conversam sobre coisas bobas durante alguns minutos.

Então ela pergunta:

“Você está diferente. Aconteceu alguma coisa?”`,
 choices:[["Contar tudo","open"],["Dizer que está tudo normal","mask"],["Fazer uma piada","funny"]]
},
sacrifice:{
 time:"11:42 • PRAÇA",title:"“Eu resolvo.”",text:`Você sabe que talvez não devesse.

Mesmo assim, oferece ajudar.

Lucas olha para você como se não esperasse aquilo.

“Por que você faria isso?”`,
 choices:[["“Porque você é meu amigo.”","friend"],["“Só paga depois.”","deal"]]
},
open:{
 time:"12:03 • CAFÉ",title:"Sem fingir",text:`Você conta.

Não tudo. Mas o suficiente.

Marina não tenta resolver sua vida.

Só escuta.

E, estranhamente, isso já ajuda.`,
 choices:[["Continuar ali","future"],["Perguntar sobre ela","relationship"]]
},
mask:{
 time:"12:05 • CAFÉ",title:"“Nada.”",text:`Marina percebe a mentira.

Ela não insiste.

Mas o jeito como ela olha para você muda um pouco.`,
 choices:[["Mudar de assunto","future"],["Contar a verdade depois","relationship"]]
},
funny:{
 time:"12:08 • CAFÉ",title:"Você faz uma piada",text:`Ela ri.

Você também.

Por alguns minutos, tudo fica leve.

Talvez seja disso que você precisava.`,
 choices:[["Ficar mais um pouco","relationship"],["Ir embora","future"]]
},
relationship:{
 time:"13:02 • RUA",title:"Uma pergunta simples",text:`Marina pergunta:

“Você gosta de mim ou gosta da ideia de alguém gostar de você?”

Você não esperava por essa.`,
 choices:[["“Eu gosto de você.”","romance"],["“Não sei.”","honestlove"],["Brincar para escapar","funny2"]]
},
romance:{
 time:"13:04 • RUA",title:"Sem certeza",text:`Você diz que gosta dela.

E, dessa vez, não sabe se está dizendo isso para ela ou para você mesmo.

Ela sorri.

“Então vamos descobrir.”`,
 choices:[["Aceitar","future"],["Pedir tempo","future"]]
},
honestlove:{
 time:"13:05 • RUA",title:"“Não sei.”",text:`Marina fica em silêncio.

Depois sorri de leve.

“Pelo menos você foi sincero.”`,
 choices:[["Agradecer","future"],["Perguntar se ela ficou chateada","future"]]
},
funny2:{
 time:"13:06 • RUA",title:"Você foge pela piada",text:`Ela ri, mas dessa vez não acompanha.

“Você sempre faz isso.”

Você entende exatamente o que ela quis dizer.`,
 choices:[["Pedir desculpas","future"],["Fingir que não entendeu","future"]]
},
future:{
 time:"DOMINGO • 21:16",title:"Domingo à noite",text:`O fim de semana acabou.

Seu pai ainda não voltou.

Lucas resolveu contar a verdade.

Marina mandou “boa noite”.

Você está sentado na cama, pensando em tudo que aconteceu.

Não existe uma música épica.

Não existe uma resposta perfeita.

Só existe amanhã.`,
 choices:[["Deixar o celular de lado","end_good"],["Mandar uma última mensagem","end_open"],["Sair para caminhar","end_gray"]]
},
friend:{
 time:"DOMINGO • 18:20",title:"Amigos",text:`Lucas pagou o que devia.

A situação em casa dele ficou difícil, mas a verdade veio antes que fosse tarde demais.

Ele nunca esqueceu que você ficou do lado dele.`,
 choices:[["Continuar","end_friend"]]
},
deal:{
 time:"DOMINGO • 18:20",title:"Um acordo",text:`Lucas aceita.

Mas a dívida agora também é sua.

Talvez amizade seja isso.

Ou talvez você só tenha dificuldade de dizer não.`,
 choices:[["Continuar","end_gray"]]
},
bad:{
 time:"DOMINGO • 23:58",title:"A escolha que volta",text:`Você ajudou Lucas a esconder.

Durante dois dias, parece que funcionou.

No terceiro, alguém descobre.

E seu nome aparece junto.

Você percebe tarde demais que proteger alguém também pode significar impedir essa pessoa de aprender.`,
 choices:[["Aceitar as consequências","end_bad"]]
},
end_good:{time:"FIM",title:"Você não resolveu tudo.",text:`Mas resolveu uma coisa importante:

parou de fingir que precisava resolver tudo.

Talvez seja um começo.

E, pela primeira vez em muito tempo, amanhã não parece tão assustador.`},
end_open:{time:"FIM",title:"Amanhã.",text:`Você manda uma mensagem simples:

“Obrigado por hoje.”

Não sabe exatamente para quem está falando.

Talvez para Marina.

Talvez para sua mãe.

Talvez para você mesmo.

A mensagem é visualizada.

E a história continua.`},
end_gray:{time:"FIM",title:"Sem resposta.",text:`Você caminha até a rua ficar silenciosa.

Algumas decisões não são boas ou ruins.

São apenas decisões.

E você ainda vai descobrir o que elas significam.`},
end_friend:{time:"FIM",title:"Rico em gente.",text:`Você não ficou rico.

Não virou famoso.

Não resolveu a vida de ninguém.

Mas quando você precisou de alguém, alguém apareceu.

Talvez isso seja uma forma de riqueza.`},
end_bad:{time:"FIM",title:"A conta chega.",text:`Você queria proteger seu amigo.

Terminou precisando aprender que intenção e consequência são coisas diferentes.

Você perdeu algumas coisas.

Mas ainda pode escolher o que fazer depois disso.`}
};

let state={scene:"start",history:[],seen:JSON.parse(localStorage.getItem("vidaEnds")||"[]")};

function render(){
 const s=scenes[state.scene]; document.getElementById("date").textContent=s.time;
 const g=document.getElementById("game");
 if(s.time==="FIM"){
   g.innerHTML=`<div class="ending"><span class="tag">FINAL DESCOBERTO</span><h1>${s.title}</h1><div class="text">${s.text}</div><div class="actions"><button class="action" onclick="restart()">↻ Viver de novo</button><button class="action" onclick="back()">← Voltar</button></div></div>`;
   if(!state.seen.includes(state.scene)){state.seen.push(state.scene);localStorage.setItem("vidaEnds",JSON.stringify(state.seen))}
 }else{
   let d=s.dialogue?`<div class="dialogue"><div class="speaker">${s.dialogue[0]}</div><div class="quote">“${s.dialogue[1]}”</div></div>`:"";
   let c=(s.choices||[]).map((x,i)=>`<button class="choice" onclick="choose('${x[1]}')"><span class="num">${i+1}</span><span>${x[0]}</span></button>`).join("");
   g.innerHTML=`<div class="sceneTop"><span>MEMÓRIA • ${state.history.length+1}</span><span>${state.history.length} decisões</span></div><div class="sceneBody"><div class="time">${s.time}</div><h1 class="title">${s.title}</h1><div class="text">${s.text}</div>${d}<div class="choices">${c}</div><div class="small">Suas escolhas não mostram o que vão causar. Algumas coisas só fazem sentido depois.</div></div>`;
 }
 renderGallery();
}
function choose(next){state.history.push(state.scene);state.scene=next;render();window.scrollTo({top:0,behavior:"smooth"})}
function back(){if(!state.history.length)return;state.scene=state.history.pop();render()}
function restart(){state={scene:"start",history:[],seen:state.seen};render()}
function renderGallery(){let names={end_good:"Um começo",end_open:"Amanhã",end_gray:"Sem resposta",end_friend:"Rico em gente",end_bad:"A conta chega"};document.getElementById("gallery").innerHTML=Object.entries(names).map(([id,n])=>`<span class="end ${state.seen.includes(id)?"unlocked":""}">${state.seen.includes(id)?"✓ ":"○ "}${n}</span>`).join("")}
render();
</script>
</body>
</html>
