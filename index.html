<style>

/* QUADRO DE INVESTIGAÇÃO */

.board{
    position:relative;
    height:600px;
    background:#0b1118;
    border:2px dashed #44596b;
    border-radius:20px;
    overflow:hidden;
    margin-top:20px;
}


.drag{
    position:absolute;
    width:170px;
    padding:15px;
    background:#182532;
    border:2px solid #ffd54a;
    border-radius:15px;
    cursor:grab;
    user-select:none;
    box-shadow:0 10px 25px #0008;
    z-index:2;
}


.drag:hover{
    transform:scale(1.03);
}


.drag:active{
    cursor:grabbing;
}


.note{
    border-color:#68d5ff;
}


</style>


<script>

/* SISTEMA DE ARRASTAR BLOCOS */

let dragItems=document.querySelectorAll(".drag");


dragItems.forEach(item=>{

let offsetX;
let offsetY;


function start(e){

let pos=e.touches ? e.touches[0] : e;


offsetX=pos.clientX-item.offsetLeft;
offsetY=pos.clientY-item.offsetTop;


document.addEventListener("mousemove",move);
document.addEventListener("mouseup",stop);

document.addEventListener("touchmove",move);
document.addEventListener("touchend",stop);

}



function move(e){

let pos=e.touches ? e.touches[0] : e;

let board=document.getElementById("board");

let rect=board.getBoundingClientRect();


let x=pos.clientX-rect.left-offsetX;
let y=pos.clientY-rect.top-offsetY;


item.style.left=x+"px";
item.style.top=y+"px";

}



function stop(){

document.removeEventListener("mousemove",move);
document.removeEventListener("mouseup",stop);

document.removeEventListener("touchmove",move);
document.removeEventListener("touchend",stop);

}


item.addEventListener("mousedown",start);
item.addEventListener("touchstart",start);


});

</script>
