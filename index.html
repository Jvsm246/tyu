<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>ENTRELINHAS — Uma História Interativa</title>

<style>
/* =========================================================
   ENTRELINHAS
   EXPERIÊNCIA FULLSCREEN — ZERO SCROLL
   ========================================================= */

:root{
    --bg:#050608;
    --panel:rgba(10,12,17,.82);
    --panel2:rgba(16,18,25,.92);
    --text:#f4f4f6;
    --muted:#9da1ab;
    --line:rgba(255,255,255,.12);
    --white:#fff;
    --accent:#dfe4eb;
    --danger:#ff5c6c;
    --success:#78e2a0;

    --scene-x:50%;
    --scene-y:50%;

    --story-bottom:clamp(18px,4vh,58px);
}

/* RESET */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    min-width:0;
    min-height:0;

    overflow:hidden !important;
    overscroll-behavior:none;

    background:#000;
    color:var(--text);

    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body{
    position:fixed;
    inset:0;
}

button,
input{
    font:inherit;
}

button{
    border:0;
}

#app{
    position:fixed;
    inset:0;

    width:100vw;
    height:100dvh;
    min-width:0;
    min-height:0;

    overflow:hidden;
    isolation:isolate;

    background:#050608;
}

/* =========================================================
   TELAS
   ========================================================= */

.screen{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    opacity:0;
    pointer-events:none;

    transition:
        opacity .55s ease,
        transform .55s ease;

    transform:scale(1.015);
}

.screen.active{
    opacity:1;
    pointer-events:auto;
    transform:scale(1);
}

/* =========================================================
   INTRO
   ========================================================= */

#intro{
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(90,100,120,.14),
            transparent 42%
        ),
        #050608;
}

.intro-noise{
    position:absolute;
    inset:0;

    pointer-events:none;

    opacity:.055;

    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
}

.intro-center{
    position:relative;
    z-index:2;

    width:min(720px,90vw);

    text-align:center;

    animation:introIn 1.4s ease both;
}

.intro-small{
    color:#8e929c;

    font-size:
        clamp(9px,1vw,13px);

    letter-spacing:
        clamp(3px,.5vw,7px);

    text-transform:uppercase;

    margin-bottom:22px;
}

.logo{
    font-size:
        clamp(54px,9vw,145px);

    line-height:.85;

    letter-spacing:
        clamp(5px,1.2vw,20px);

    font-weight:300;

    color:#f5f5f7;

    text-shadow:
        0 0 45px rgba(255,255,255,.08);
}

.logo-line{
    width:min(230px,35vw);
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #fff,
            transparent
        );

    margin:30px auto;
    opacity:.35;
}

.intro-sub{
    color:#8f939d;

    font-size:
        clamp(12px,1.4vw,17px);

    letter-spacing:2px;

    margin-bottom:38px;
}

.start-btn{
    position:relative;

    padding:
        15px 28px;

    border:1px solid rgba(255,255,255,.18);

    border-radius:999px;

    color:#fff;
    background:rgba(255,255,255,.045);

    cursor:pointer;

    transition:
        background .25s,
        border-color .25s,
        transform .25s;
}

.start-btn:hover{
    background:rgba(255,255,255,.11);
    border-color:rgba(255,255,255,.4);
    transform:translateY(-2px);
}

.start-btn span{
    margin-left:8px;
    opacity:.6;
}

@keyframes introIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

/* =========================================================
   STORY
   ========================================================= */

#story{
    display:flex;
    flex-direction:column;

    background:#050608;
}

/* HEADER */

.topbar{
    position:absolute;

    z-index:40;

    top:0;
    left:0;
    right:0;

    height:
        clamp(54px,7vh,76px);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:
        0 clamp(16px,3vw,48px);

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.7),
            transparent
        );

    pointer-events:none;
}

.topbar > *{
    pointer-events:auto;
}

.story-title{
    font-size:
        clamp(10px,1vw,13px);

    letter-spacing:
        clamp(2px,.35vw,5px);

    color:rgba(255,255,255,.68);

    text-transform:uppercase;
}

.top-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.time{
    color:rgba(255,255,255,.55);
    font-size:12px;
}

.phone-open{
    width:38px;
    height:38px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;

    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);

    cursor:pointer;

    transition:.25s;

    position:relative;
}

.phone-open:hover{
    background:rgba(255,255,255,.16);
    transform:scale(1.05);
}

.phone-badge{
    position:absolute;

    top:-2px;
    right:-2px;

    min-width:15px;
    height:15px;

    padding:0 4px;

    border-radius:20px;

    display:none;
    align-items:center;
    justify-content:center;

    background:#fff;
    color:#111;

    font-size:9px;
    font-weight:800;
}

.phone-badge.visible{
    display:flex;
}

/* =========================================================
   CENA
   ========================================================= */

.scene{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;
}

.scene-image{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#0a0c10;
}

.scene-image::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.18),
            transparent 28%,
            rgba(0,0,0,.12) 55%,
            rgba(0,0,0,.82) 100%
        );
}

/* =========================================================
   CENÁRIOS
   ========================================================= */

.art{
    position:absolute;
    inset:-3%;

    width:106%;
    height:106%;

    transition:
        opacity .8s ease,
        transform 1.2s cubic-bezier(.2,.7,.2,1);

    animation:
        sceneBreath 12s ease-in-out infinite alternate;
}

.art.hidden{
    opacity:0;
}

@keyframes sceneBreath{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.035);
    }
}

/* Quarto */

.room{
    background:
        radial-gradient(
            ellipse at 70% 25%,
            rgba(200,205,220,.14),
            transparent 25%
        ),
        linear-gradient(
            110deg,
            #11151d 0%,
            #090b10 45%,
            #151923 100%
        );
}

.room::before{
    content:"";

    position:absolute;

    width:42%;
    height:70%;

    right:7%;
    top:9%;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.04),
            rgba(255,255,255,.13),
            rgba(255,255,255,.02)
        );

    box-shadow:
        0 0 100px rgba(170,185,220,.08);

    transform:skewY(-3deg);
}

.room::after{
    content:"";

    position:absolute;

    width:45%;
    height:15%;

    left:3%;
    bottom:7%;

    background:#08090c;

    border-radius:50%;

    box-shadow:
        0 -18px 0 -5px #171b23;
}

/* Rua */

.street{
    background:
        radial-gradient(
            ellipse at 70% 35%,
            rgba(230,230,255,.2),
            transparent 13%
        ),
        linear-gradient(
            135deg,
            #0a0d12,
            #11151c 48%,
            #06070a
        );
}

.street::before{
    content:"";

    position:absolute;

    width:55%;
    height:130%;

    left:15%;
    top:-10%;

    transform:skewX(-16deg);

    background:
        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,.025) 0 5px,
            transparent 5px 75px
        );

    filter:blur(1px);
}

.street::after{
    content:"";

    position:absolute;
    left:0;
    right:0;
    bottom:0;

    height:35%;

    background:
        linear-gradient(
            to top,
            #030405,
            transparent
        );
}

/* Café */

.cafe{
    background:
        radial-gradient(
            ellipse at 50% 35%,
            rgba(210,180,135,.18),
            transparent 24%
        ),
        linear-gradient(
            125deg,
            #16120f,
            #211914 50%,
            #090807
        );
}

.cafe::before{
    content:"";

    position:absolute;

    left:12%;
    top:13%;

    width:76%;
    height:48%;

    border:1px solid rgba(255,255,255,.05);

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.04),
            rgba(0,0,0,.3)
        );

    box-shadow:
        0 0 80px rgba(220,180,130,.08);
}

.cafe::after{
    content:"";

    position:absolute;

    bottom:0;
    left:0;
    right:0;

    height:33%;

    background:
        linear-gradient(
            to top,
            #050505,
            transparent
        );
}

/* =========================================================
   PERSONAGENS SILHUETAS
   ========================================================= */

.character{
    position:absolute;

    bottom:7%;
    left:50%;

    width:clamp(130px,18vw,300px);
    height:clamp(300px,64vh,650px);

    transform:
        translateX(-50%);

    opacity:.9;

    pointer-events:none;

    transition:
        transform .7s ease,
        opacity .7s ease;
}

.character .head{
    position:absolute;

    top:0;
    left:50%;

    width:24%;
    aspect-ratio:1;

    transform:translateX(-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 40% 35%,
            #a9a2a0,
            #555052 70%,
            #252326
        );

    box-shadow:
        0 0 35px rgba(255,255,255,.08);
}

.character .body{
    position:absolute;

    left:50%;
    bottom:0;

    width:72%;
    height:78%;

    transform:translateX(-50%);

    border-radius:
        35% 35% 8% 8%;

    background:
        linear-gradient(
            100deg,
            #17191e,
            #08090c 65%,
            #191b20
        );

    box-shadow:
        0 0 70px rgba(0,0,0,.8);
}

.character.left{
    left:28%;
}

.character.right{
    left:72%;
}

.character.hidden{
    opacity:0;
    transform:translateX(-50%) translateY(30px);
}

/* =========================================================
   HISTÓRIA
   ========================================================= */

.story-layer{
    position:absolute;
    z-index:20;

    left:0;
    right:0;
    bottom:0;

    padding:
        0 clamp(14px,5vw,100px)
        var(--story-bottom);

    pointer-events:none;
}

.story-content{
    width:min(1100px,100%);
    margin:auto;

    pointer-events:auto;
}

.scene-location{
    display:flex;
    align-items:center;
    gap:9px;

    color:rgba(255,255,255,.48);

    font-size:
        clamp(9px,1vw,12px);

    letter-spacing:3px;

    text-transform:uppercase;

    margin-bottom:10px;
}

.scene-location::before{
    content:"";

    width:24px;
    height:1px;

    background:rgba(255,255,255,.35);
}

.narrator{
    color:rgba(255,255,255,.55);

    font-size:
        clamp(11px,1.25vw,15px);

    line-height:1.5;

    margin-bottom:10px;

    max-width:850px;
}

.dialogue{
    font-size:
        clamp(19px,2.5vw,36px);

    line-height:1.15;

    font-weight:400;

    max-width:1000px;

    text-wrap:balance;

    text-shadow:
        0 2px 25px rgba(0,0,0,.8);
}

.speaker{
    display:block;

    font-size:
        clamp(9px,1vw,12px);

    letter-spacing:3px;

    color:rgba(255,255,255,.48);

    text-transform:uppercase;

    margin-bottom:6px;
}

/* =========================================================
   ESCOLHAS
   ========================================================= */

.choices{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:8px;

    margin-top:18px;

    max-width:920px;
}

.choice{
    min-width:0;

    min-height:48px;

    padding:
        12px 16px;

    color:#e8e8eb;

    text-align:left;

    background:
        rgba(5,6,9,.58);

    border:
        1px solid rgba(255,255,255,.12);

    border-radius:8px;

    cursor:pointer;

    backdrop-filter:blur(12px);

    transition:
        background .2s,
        border-color .2s,
        transform .2s;
}

.choice:hover{
    background:
        rgba(255,255,255,.1);

    border-color:
        rgba(255,255,255,.3);

    transform:
        translateY(-2px);
}

.choice small{
    display:block;

    color:rgba(255,255,255,.38);

    margin-top:4px;

    font-size:10px;
}

/* =========================================================
   CONTINUAR
   ========================================================= */

.continue{
    display:inline-flex;
    align-items:center;
    gap:10px;

    margin-top:18px;

    padding:10px 17px;

    border-radius:999px;

    color:#fff;

    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);

    cursor:pointer;

    transition:.2s;
}

.continue:hover{
    background:rgba(255,255,255,.14);
}

/* =========================================================
   PHONE OVERLAY
   ========================================================= */

#phoneLayer{
    position:fixed;
    inset:0;

    z-index:100;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:
        max(16px,env(safe-area-inset-top))
        16px
        max(16px,env(safe-area-inset-bottom));

    background:
        rgba(0,0,0,.72);

    backdrop-filter:
        blur(12px);

    opacity:0;
    pointer-events:none;

    transition:
        opacity .3s ease;
}

#phoneLayer.open{
    opacity:1;
    pointer-events:auto;
}

.phone{
    position:relative;

    width:min(390px,88vw);
    height:min(760px,88dvh);

    max-height:88dvh;

    border:
        7px solid #17191e;

    border-radius:
        clamp(30px,4vw,46px);

    overflow:hidden;

    background:#08090c;

    box-shadow:
        0 40px 100px rgba(0,0,0,.75),
        0 0 0 1px rgba(255,255,255,.08);

    transform:
        translateY(30px)
        scale(.94);

    transition:
        transform .4s cubic-bezier(.2,.8,.2,1);
}

#phoneLayer.open .phone{
    transform:
        translateY(0)
        scale(1);
}

.phone-notch{
    position:absolute;
    z-index:50;

    top:7px;
    left:50%;

    transform:translateX(-50%);

    width:100px;
    height:25px;

    border-radius:
        0 0 16px 16px;

    background:#050608;
}

.phone-screen{
    position:absolute;
    inset:0;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            #11141a,
            #07080b
        );
}

.phone-page{
    position:absolute;
    inset:0;

    display:none;
    flex-direction:column;

    min-height:0;

    overflow:hidden;
}

.phone-page.active{
    display:flex;
}

/* Phone header */

.phone-header{
    flex:none;

    height:64px;

    padding:
        25px 18px 5px;

    display:flex;
    align-items:flex-end;
    justify-content:space-between;

    border-bottom:1px solid rgba(255,255,255,.08);
}

.phone-header h2{
    font-size:17px;
    font-weight:500;
}

.phone-header button{
    color:#aaa;
    background:none;
    cursor:pointer;
}

/* Home */

.phone-home{
    flex:1;

    padding:90px 22px 22px;

    overflow:hidden;
}

.phone-clock{
    font-size:52px;
    font-weight:200;
    letter-spacing:-3px;
}

.phone-date{
    color:#777c86;
    font-size:12px;

    margin-top:2px;
}

.phone-apps{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:16px;

    margin-top:45px;
}

.app{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:7px;

    color:#aaa;

    cursor:pointer;
}

.app-icon{
    width:57px;
    height:57px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:17px;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid rgba(255,255,255,.07);

    font-size:22px;

    position:relative;
}

.app-label{
    font-size:10px;
}

.app-badge{
    position:absolute;

    top:-5px;
    right:-5px;

    min-width:17px;
    height:17px;

    padding:0 4px;

    border-radius:20px;

    background:#fff;
    color:#111;

    display:none;
    align-items:center;
    justify-content:center;

    font-size:9px;
    font-weight:800;
}

.app-badge.show{
    display:flex;
}

/* Contacts */

.contact-list{
    flex:1;

    min-height:0;

    padding:12px;

    overflow:auto;

    scrollbar-width:none;
}

.contact-list::-webkit-scrollbar{
    display:none;
}

.contact{
    width:100%;

    display:flex;
    align-items:center;

    gap:12px;

    padding:13px 8px;

    color:#eee;
    background:none;

    border-bottom:
        1px solid rgba(255,255,255,.05);

    cursor:pointer;

    text-align:left;
}

.avatar{
    width:42px;
    height:42px;

    flex:none;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #3a3d45,
            #15171c
        );

    color:#eee;

    font-size:13px;
}

.contact-info{
    min-width:0;
    flex:1;
}

.contact-name{
    font-size:13px;
}

.contact-last{
    color:#6f737d;

    font-size:10px;

    margin-top:3px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.contact-unread{
    min-width:18px;
    height:18px;

    padding:0 5px;

    display:none;
    align-items:center;
    justify-content:center;

    border-radius:20px;

    background:#eee;
    color:#111;

    font-size:9px;
}

/* Chat */

.chat-head{
    flex:none;

    height:65px;

    display:flex;
    align-items:flex-end;

    padding:
        25px 12px 8px;

    gap:10px;

    border-bottom:1px solid rgba(255,255,255,.08);
}

.chat-back{
    color:#aaa;
    background:none;

    cursor:pointer;

    padding:5px;
}

.chat-person{
    flex:1;
}

.chat-person strong{
    display:block;
    font-size:13px;
}

.chat-status{
    display:block;

    color:#656a74;

    font-size:9px;

    margin-top:2px;
}

.chat-messages{
    flex:1;

    min-height:0;

    overflow-y:auto;
    overflow-x:hidden;

    padding:
        15px 12px 12px;

    scrollbar-width:none;

    display:flex;
    flex-direction:column;
    gap:7px;
}

.chat-messages::-webkit-scrollbar{
    display:none;
}

.message{
    max-width:78%;

    padding:
        9px 11px;

    border-radius:15px;

    font-size:12px;
    line-height:1.35;

    animation:messageIn .25s ease both;
}

.message.me{
    align-self:flex-end;

    background:#e9e9ea;
    color:#111;

    border-bottom-right-radius:4px;
}

.message.them{
    align-self:flex-start;

    background:#20232a;
    color:#eee;

    border-bottom-left-radius:4px;
}

.message-time{
    display:block;

    margin-top:3px;

    font-size:8px;

    opacity:.38;

    text-align:right;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(8px) scale(.98);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.chat-input{
    flex:none;

    display:flex;
    gap:6px;

    padding:
        8px;

    border-top:
        1px solid rgba(255,255,255,.08);
}

.chat-input input{
    flex:1;

    min-width:0;

    height:38px;

    padding:
        0 12px;

    color:#eee;

    outline:none;

    border:
        1px solid rgba(255,255,255,.08);

    border-radius:20px;

    background:#14161b;
}

.chat-input button{
    width:38px;
    height:38px;

    border-radius:50%;

    color:#111;
    background:#eee;

    cursor:pointer;
}

/* Memories */

.memory-list{
    flex:1;

    min-height:0;

    overflow:auto;

    padding:15px;

    scrollbar-width:none;
}

.memory-list::-webkit-scrollbar{
    display:none;
}

.memory{
    padding:
        13px;

    margin-bottom:8px;

    border-radius:12px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid rgba(255,255,255,.06);
}

.memory-title{
    font-size:11px;
    color:#eee;
}

.memory-text{
    margin-top:5px;

    font-size:10px;
    line-height:1.4;

    color:#737781;
}

/* =========================================================
   TOAST
   ========================================================= */

.toast{
    position:fixed;

    z-index:200;

    top:
        max(20px,env(safe-area-inset-top));

    left:50%;

    transform:
        translate(-50%,-120%);

    width:min(360px,88vw);

    padding:12px 14px;

    border:
        1px solid rgba(255,255,255,.13);

    border-radius:12px;

    background:
        rgba(12,14,19,.92);

    box-shadow:
        0 20px 50px rgba(0,0,0,.45);

    backdrop-filter:blur(15px);

    transition:
        transform .4s cubic-bezier(.2,.8,.2,1);

    pointer-events:none;
}

.toast.show{
    transform:
        translate(-50%,0);
}

.toast-title{
    font-size:11px;
    color:#fff;
}

.toast-text{
    margin-top:3px;

    font-size:10px;

    color:#777c86;
}

/* =========================================================
   FINAIS
   ========================================================= */

#ending{
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(160,170,190,.1),
            transparent 38%
        ),
        #050608;
}

.ending-box{
    width:min(700px,88vw);

    text-align:center;
}

.ending-over{
    color:#747982;

    text-transform:uppercase;

    font-size:10px;

    letter-spacing:4px;

    margin-bottom:20px;
}

.ending-title{
    font-size:
        clamp(38px,6vw,85px);

    line-height:.95;

    font-weight:300;
}

.ending-text{
    margin:
        25px auto 35px;

    max-width:580px;

    color:#858993;

    font-size:
        clamp(12px,1.4vw,16px);

    line-height:1.7;
}

.restart{
    padding:12px 22px;

    border-radius:999px;

    color:#fff;

    background:
        rgba(255,255,255,.07);

    border:
        1px solid rgba(255,255,255,.14);

    cursor:pointer;
}

/* =========================================================
   TRANSIÇÃO CINEMATOGRÁFICA
   ========================================================= */

.scene-flash{
    position:fixed;
    inset:0;

    z-index:80;

    pointer-events:none;

    background:#fff;

    opacity:0;
}

.scene-flash.play{
    animation:
        flash .65s ease;
}

@keyframes flash{
    0%{opacity:0}
    12%{opacity:.08}
    100%{opacity:0}
}

/* =========================================================
   RESPONSIVO
   ========================================================= */

@media(max-width:700px){

    .choices{
        grid-template-columns:1fr;
        gap:6px;
    }

    .choice{
        min-height:43px;
        padding:10px 12px;
        font-size:12px;
    }

    .dialogue{
        font-size:
            clamp(18px,5.2vw,27px);
    }

    .narrator{
        font-size:11px;
    }

    .story-layer{
        padding:
            0 14px
            max(14px,env(safe-area-inset-bottom));
    }

    .phone{
        width:min(380px,94vw);
        height:min(730px,92dvh);
    }
}

@media(max-height:620px){

    .story-layer{
        --story-bottom:12px;
    }

    .dialogue{
        font-size:
            clamp(16px,3vw,25px);
    }

    .narrator{
        display:none;
    }

    .choices{
        margin-top:10px;
    }

    .choice{
        min-height:39px;
        padding:8px 11px;
    }

    .character{
        height:78vh;
    }
}

@media(min-width:1500px){

    .story-layer{
        padding-left:
            clamp(60px,10vw,180px);

        padding-right:
            clamp(60px,10vw,180px);
    }
}

/* =========================================================
   ACESSIBILIDADE
   ========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
    }
}

/* =========================================================
   TEMPO
   ========================================================= */

function formatTime(){

    const h =
        Math.floor(
            game.timeMinutes / 60
        ) % 24;

    const m =
        game.timeMinutes % 60;

    return String(h).padStart(2,"0")
        + ":"
        + String(m).padStart(2,"0");
}

function advanceTime(minutes){

    game.timeMinutes += minutes;

    $("gameTime").textContent =
        formatTime();

    $("phoneClock").textContent =
        formatTime();
}


/* =========================================================
   MEMÓRIA
   ========================================================= */

function remember(title,text){

    game.memories.unshift({
        title,
        text,
        time:formatTime()
    });

    if(game.memories.length>30){

        game.memories =
            game.memories.slice(0,30);

    }

    renderMemories();

    saveGame();
}

function renderMemories(){

    memoryList.innerHTML = "";

    if(!game.memories.length){

        memoryList.innerHTML = `
            <div class="memory">
                <div class="memory-title">
                    Ainda não há memórias.
                </div>
            </div>
        `;

        return;
    }

    game.memories.forEach(memory=>{

        const el =
            document.createElement("div");

        el.className="memory";

        el.innerHTML=`

            <div class="memory-title">
                ${escapeHTML(memory.title)}
            </div>

            <div class="memory-text">
                ${escapeHTML(memory.text)}
            </div>

        `;

        memoryList.appendChild(el);

    });
}


/* =========================================================
   RELACIONAMENTOS
   ========================================================= */

function changeRelationship(
    character,
    changes
){

    const r =
        game.relationships[character];

    if(!r)return;

    Object.entries(changes)
        .forEach(([key,value])=>{

            if(typeof r[key] !== "number"){
                r[key]=0;
            }

            r[key] += value;

            r[key] =
                Math.max(
                    0,
                    Math.min(100,r[key])
                );

        });

    saveGame();
}


/* =========================================================
   CLASSIFICADOR DE MENSAGEM
   ========================================================= */

function classifyMessage(text){

    const t =
        text
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g,"");

    if(
        /(vai tomar no cu|vai se foder|idiota|imbecil|otario|babaca|merda|porra)/.test(t)
    ){
        return "insult";
    }

    if(
        /(desculpa|foi mal|perdao|perdoa|nao queria)/.test(t)
    ){
        return "apology";
    }

    if(
        /(amo|gosto de voce|te adoro|saudade|sinto sua falta)/.test(t)
    ){
        return "affection";
    }

    if(
        /(nao sei|tanto faz|deixa|esquece)/.test(t)
    ){
        return "cold";
    }

    if(
        /(obrigado|valeu|vlw)/.test(t)
    ){
        return "kind";
    }

    if(
        /(por que|porque|como assim|o que aconteceu)/.test(t)
    ){
        return "question";
    }

    if(
        /(kkkk|haha|hahaha|brincadeira)/.test(t)
    ){
        return "joke";
    }

    return "neutral";
}

/* =========================================================
   CHAT
   ========================================================= */

function addMessage(
    character,
    from,
    text
){

    if(!chats[character]){
        chats[character]=[];
    }

    chats[character].push({

        from,
        text,
        time:formatTime()

    });

    renderContacts();

    if(
        game.selectedCharacter===character &&
        phoneLayer.classList.contains("open")
    ){

        renderChat(character);

    }

    updatePhoneBadge();

    saveGame();
}


function renderContacts(){

    contactList.innerHTML="";

    Object.keys(chats)
        .forEach(character=>{

            const person =
                characters[character];

            const list =
                chats[character];

            const last =
                list[list.length-1];

            const unread =
                list.filter(
                    m=>m.from==="them" && !m.read
                ).length;

            const el =
                document.createElement("button");

            el.className="contact";

            el.onclick=()=>{
                openChat(character);
            };

            el.innerHTML=`

                <div class="avatar">
                    ${person.initial}
                </div>

                <div class="contact-info">

                    <div class="contact-name">
                        ${person.name}
                    </div>

                    <div class="contact-last">
                        ${escapeHTML(last?.text || "")}
                    </div>

                </div>

                <span
                    class="contact-unread"
                    style="
                        display:${unread ? "flex":"none"}
                    ">
                    ${unread}
                </span>

            `;

            contactList.appendChild(el);

        });

}


function openChat(character){

    game.selectedCharacter =
        character;

    switchPhonePage("phoneChat");

    $("chatName").textContent =
        characters[character].name;

    $("chatAvatar").textContent =
        characters[character].initial;

    const r =
        game.relationships[character];

    if(r.hurt > 35){

        $("chatStatus").textContent =
            "digitando...";

    }else if(r.irritation > 35){

        $("chatStatus").textContent =
            "visto recentemente";

    }else{

        $("chatStatus").textContent =
            "online";
    }

    chats[character].forEach(
        message=>{

            if(message.from==="them"){
                message.read=true;
            }

        }
    );

    renderChat(character);

    updatePhoneBadge();

}


function renderChat(character){

    chatMessages.innerHTML="";

    chats[character]
        .forEach(message=>{

            const el =
                document.createElement("div");

            el.className =
                "message " +
                (
                    message.from==="me"
                        ? "me"
                        : "them"
                );

            el.innerHTML=`

                ${escapeHTML(message.text)}

                <span class="message-time">
                    ${message.time}
                </span>

            `;

            chatMessages.appendChild(el);

        });

    requestAnimationFrame(()=>{

        chatMessages.scrollTop =
            chatMessages.scrollHeight;

    });

}

function openPhone(){

    phoneLayer.setAttribute(
        "aria-hidden",
        "false"
    );

    updatePhoneBadge();

}


function closePhone(){

    phoneLayer.classList.remove("open");

    phoneLayer.setAttribute(
        "aria-hidden",
        "true"
    );

    game.selectedCharacter=null;

}


function switchPhonePage(id){

    document
        .querySelectorAll(".phone-page")
        .forEach(page=>{
            page.classList.remove("active");
        });

    $(id).classList.add("active");

}


function openPhoneHome(){

    switchPhonePage(
        "phoneHome"
    );

}


function openContacts(){

    renderContacts();

    switchPhonePage(
        "phoneContacts"
    );

}


function openMemories(){

    renderMemories();

    switchPhonePage(
        "phoneMemories"
    );

}


function updatePhoneBadge(){

    let unread=0;

    Object.values(chats)
        .forEach(list=>{

            unread +=
                list.filter(
                    m=>m.from==="them" && !m.read
                ).length;

        });

    const badge =
        $("phoneBadge");

    const messageBadge =
        $("messageBadge");

    if(unread){

        badge.textContent =
            unread > 9 ? "9+" : unread;

        badge.classList.add("visible");

        messageBadge.textContent =
            unread > 9 ? "9+" : unread;

        messageBadge.classList.add("show");

    }else{

        badge.classList.remove(
            "visible"
        );

        messageBadge.classList.remove(
            "show"
        );

    }

}

/* =========================================================
   TYPEWRITER
   ========================================================= */

let typingTimer=null;

function typeText(
    element,
    text,
    speed=13
){

    clearInterval(
        typingTimer
    );

    element.textContent="";

    let i=0;

    typingTimer =
        setInterval(()=>{

            element.textContent +=
                text[i];

            i++;

            if(i>=text.length){

                clearInterval(
                    typingTimer
                );

            }

        },speed);

}

    );

    if(
        game.scene!=="cafe" &&
        game.scene!=="lucasStart" &&
        game.scene!=="lucasTalk" &&
        game.scene!=="lucasSerious" &&
        game.scene!=="lucasConcern"
    ){

        hideCharacters();

    }

    if(
        game.scene==="marinaTalk" ||
        game.scene==="marinaQuestion" ||
        game.scene==="reveal" ||
        game.scene==="endTalk"
    ){

        showCharacter("marina");

    }

    sceneLocation.textContent =
        scene.location;

    narrator.textContent =
        scene.narrator || "";

    dialogue.innerHTML="";

    if(scene.speaker){

        dialogue.innerHTML=`

            <span class="speaker">
                ${escapeHTML(scene.speaker)}
            </span>

        `;

    }

    const text =
        scene.dialogue || "";

    const textNode =
        document.createElement("span");

    dialogue.appendChild(
        textNode
    );

    typeText(
        textNode,
        text,
        10
    );


    choices.innerHTML="";

    scene.choices
        .forEach(
            (choice,index)=>{

                const button =
                    document.createElement("button");

                button.className="choice";

                button.innerHTML =
                    escapeHTML(
                        choice.text
                    );

                button.onclick=()=>{

                    choose(
                        choice
                    );

                };

                choices.appendChild(
                    button
                );

            }
        );


    advanceTime(1);

    saveGame();

}


/* =========================================================
   ESCOLHA
   ========================================================= */

function choose(choice){

    if(!choice)return;

    choices
        .querySelectorAll("button")
        .forEach(
            b=>b.disabled=true
        );

    const next =
        choice.action
            ? choice.action()
            : null;

    if(!next){

        choices
            .querySelectorAll("button")
            .forEach(
                b=>b.disabled=false
            );

        return;
    }

    transitionScene(
        next
    );

}


function transitionScene(next){

    $("sceneFlash")
        .classList.remove("play");

    void $("sceneFlash").offsetWidth;

    $("sceneFlash")
        .classList.add("play");

    setTimeout(()=>{

        game.scene =
            next;

        if(next==="ending"){

            showEnding();

        }else{

            render();

        }

    },220);

}


/* =========================================================
   FINAL
   ========================================================= */

function showEnding(){

    story.classList.remove("active");

    ending.classList.add("active");

    const score =
        game.relationships.lucas.trust +
        game.relationships.marina.trust +
        game.relationships.mother.trust;

    if(score>=210){

        $("endingTitle").textContent =
            "AINDA HÁ TEMPO";

        $("endingText").textContent =
            "Você não resolveu tudo. Mas, pela primeira vez, parou de fugir de todas as conversas ao mesmo tempo. Algumas pessoas ficaram. Outras ainda estavam decidindo.";

    }

    else if(
        game.relationships.lucas.closeness < 30
    ){

        $("endingTitle").textContent =
            "SILÊNCIO";

        $("endingText").textContent =
            "Você ganhou algumas horas de paz. O problema é que paz e silêncio nem sempre são a mesma coisa.";

    }

    else{

        $("endingTitle").textContent =
            "ENTRELINHAS";

        $("endingText").textContent =
            "Nem tudo foi dito. Talvez essa seja justamente a parte mais perigosa da história.";

    }

}


/* =========================================================
   RESTART
   ========================================================= */

function restartGame(){

    localStorage.removeItem(
        "entrelinhas_save"
    );

    location.reload();

}


/* =========================================================
   STORAGE
   ========================================================= */

function saveGame(){

    try{

        localStorage.setItem(
            "entrelinhas_save",
            JSON.stringify({

                scene:game.scene,

                timeMinutes:
                    game.timeMinutes,

                history:
                    game.history,

                memories:
                    game.memories,

                flags:
                    game.flags,

                relationships:
                    game.relationships,

                chats

            })
        );

    }catch(error){

        console.warn(
            "Não foi possível salvar:",
            error
        );

    }

}


/* =========================================================
   LOAD
   ========================================================= */

function loadGame(){

    try{

        const raw =
            localStorage.getItem(
                "entrelinhas_save"
            );

        if(!raw)return false;

        const data =
            JSON.parse(raw);

        if(!data)return false;

        game.scene =
            data.scene || "arrival";

        game.timeMinutes =
            data.timeMinutes ||
            game.timeMinutes;

        game.history =
            data.history || [];

        game.memories =
            data.memories || [];

        game.flags =
            data.flags || {};

        if(data.relationships){

            Object.keys(
                game.relationships
            ).forEach(character=>{

                if(
                    data.relationships[character]
                ){

                    game.relationships[character] =
                        {
                            ...game.relationships[character],
                            ...data.relationships[character]
                        };

                }

            });

        }

        if(data.chats){

            chats =
                data.chats;

        }

        return true;

    }catch(error){

        console.warn(
            "Save inválido:",
            error
        );

        return false;

    }

}


/* =========================================================
   UTIL
   ========================================================= */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   BOTÃO COMEÇAR
   ========================================================= */

$("startButton")
    .addEventListener(
        "click",
        ()=>{

            intro.classList.remove(
                "active"
            );

            story.classList.add(
                "active"
            );

            game.scene="arrival";

            render();

            setTimeout(()=>{

                showToast(
                    "23:47",
                    "Uma nova noite começou."
                );

            },800);

        }
    );


/* =========================================================
   BOTÃO CELULAR
   ========================================================= */

$("phoneButton")
    .addEventListener(
        "click",
        openPhone
    );


/* =========================================================
   ESC
   ========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(event.key==="Escape"){

            closePhone();

        }

        if(
            event.key.toLowerCase()==="p"
        ){

            if(
                phoneLayer.classList.contains(
                    "open"
                )
            ){

                closePhone();

            }else{

                openPhone();

            }

        }

    }
);


/* =========================================================
   RELÓGIO
   ========================================================= */

setInterval(()=>{

    $("gameTime").textContent =
        formatTime();

    $("phoneClock").textContent =
        formatTime();

},1000);


/* =========================================================
   EVENTO ALEATÓRIO
   ========================================================= */

setInterval(()=>{

    if(
        !story.classList.contains(
            "active"
        )
    )return;

    if(
        phoneLayer.classList.contains(
            "open"
        )
    )return;

    const random =
        Math.random();

    if(
        random < .18 &&
        game.scene!=="arrival"
    ){

        addMessage(
            "lucas",
            "them",
            "mano..."
        );

        showToast(
            "Lucas",
            "Nova mensagem"
        );

    }

},30000);


/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

loadGame();

renderContacts();

renderMemories();

updatePhoneBadge();


/*
   IMPORTANTE:

   O jogo começa na tela inicial.
   O save continua existindo mesmo após fechar
   o navegador.

   E a página inteira continua travada:
   não existe scroll vertical nem horizontal.
*/

</script>
