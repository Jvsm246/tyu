<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>O Mistério do Pão Desaparecido</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#090d13;
    color:#eef2f7;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(circle at top,#1b3044 0,transparent 45%);
    pointer-events:none;
}

.container{
    width:min(1050px,92%);
    margin:auto;
    padding:28px 0 60px;
}

.screen{
    display:none;
    animation:fade .35s;
}

.screen.active{
    display:block;
}

@keyframes fade{

from{
    opacity:0;
    transform:translateY(8px);
}

to{
    opacity:1;
    transform:translateY(0);
}

}

.panel,
.card{
    background:#121b26;
    border:1px solid #2c4053;
    border-radius:18px;
    padding:22px;
    margin:16px 0;
    box-shadow:0 16px 40px #0007;
}

h1{
    font-size:clamp(34px,7vw,64px);
    margin:8px 0;
    color:#ffd54a;
}

h2{
    color:#68d5ff;
}

h3{
    color:#ffd54a;
}

.subtitle{
    color:#aebdcc;
    font-size:18px;
}

.ai{
    border-left:5px solid #68d5ff;
}

.ai b{
    color:#68d5ff;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 18px;
    margin:6px;
    cursor:pointer;
    font-weight:800;
    background:#ffd54a;
    color:#111;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    filter:brightness(1.08);
}

.secondary{
    background:#27394a;
    color:white;
}

.danger{
    background:#d94b4b;
    color:white;
}

.secret{
    background:#8f55d6;
    color:white;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:13px;
}

.suspect{
    background:#182532;
    border:1px solid #344c61;
    border-radius:15px;
    padding:18px;
    cursor:pointer;
    transition:.2s;
}

.suspect:hover{
    transform:translateY(-3px);
    border-color:#ffd54a;
}

.suspect.seen{
    outline:2px solid #52c77a;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:999px;
    background:#263b4d;
    color:#bde8ff;
    font-size:12px;
}

.hidden{
    display:none;
}

.clue{
    padding:12px;
    border-left:4px solid #ffd54a;
    background:#171f29;
    margin:9px 0;
    border-radius:8px;
}

.choice{
    display:block;
    width:100%;
    text-align:left;
    margin:9px 0;
}

.ending{
    text-align:center;
    padding:35px;
}

.ending .icon{
    font-size:70px;
}

#progress{
    height:8px;
    background:#1c2935;
    border-radius:10px;
    overflow:hidden;
    margin:14px 0;
}

#bar{
    height:100%;
    width:0;
    background:#ffd54a;
    transition:.3s;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
    background:#121b26;
}

table th{
    background:#1d2b38;
    color:#68d5ff;
    padding:12px;
}

table td{
    border:1px solid #344c61;
    padding:12px;
    text-align:center;
}

table tr:hover{
    background:#1b2734;
}

footer{
    text-align:center;
    color:#718293;
    margin-top:35px;
    font-size:13px;
}

</style>

</head>
